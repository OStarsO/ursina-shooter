name: release

# 推 v* 标签或手动 Run workflow 时，构建 Windows exe 并作为构建产物上传（不改动 Release）。
# Release 资产由维护者手工发布，避免 CI 覆盖已写好的更新说明。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "PySide6>=6.5,<7" "pyinstaller>=6.0"

      - name: Build launcher exe
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "射击启动器" `
            --icon "${{ github.workspace }}/assets/icon.ico" `
            --distpath dist --workpath build --specpath build `
            --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtWebEngineWidgets `
            --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick `
            --exclude-module PySide6.Qt3DCore --exclude-module PySide6.QtMultimedia `
            --exclude-module PySide6.QtCharts --exclude-module PySide6.QtPdf `
            --exclude-module tkinter launcher.py

      - name: Smoke test (compile)
        run: python -m py_compile app_style.py room_net.py net_ui.py launcher.py 射击.py

      - name: Normalize artifact name
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe | ForEach-Object {
            $target = "dist\ursina-shooter-launcher-$env:GITHUB_REF_NAME.exe"
            Move-Item -LiteralPath $_.FullName -Destination $target -Force
            Get-Item -LiteralPath $target | Select-Object Name, Length
          }

      - uses: actions/upload-artifact@v4
        with:
          name: shooting-launcher
          path: dist/*.exe
